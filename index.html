<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>happy birthday ♡</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Dancing+Script:wght@400;700&family=Fraunces:opsz,wght@9..144,300;9..144,500&display=swap" rel="stylesheet">
<style>
:root{--cream:#f6f1e7;--ink:#2d2a26;--muted:#8a8278;--pink:#f4a7c3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);font-family:"Fraunces",Georgia,serif;font-weight:300;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;transition:opacity 1s ease}
.hidden{opacity:0;pointer-events:none}
.eyebrow{letter-spacing:.28em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.hand{font-family:"Caveat",cursive;font-weight:700}
.pill{border:1px solid var(--ink);background:transparent;border-radius:999px;padding:10px 26px;font-size:15px;transition:.2s}
.pill:hover{background:var(--ink);color:var(--cream)}
.link{background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
#start h1{font-size:clamp(44px,11vw,72px)}
h2{font-weight:300;font-size:clamp(26px,6vw,40px);text-align:center}
#cake{width:min(84vw,380px);height:auto;overflow:visible}
#hint{font-size:15px;color:var(--muted);text-align:center;min-height:1.4em}
.candle{cursor:pointer}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .18s ease-in-out infinite alternate;transition:opacity .25s}
.glow{animation:glow 1.4s ease-in-out infinite alternate;transition:opacity .25s}
.out .flame,.out .glow{opacity:0;animation:none}
@keyframes flick{from{transform:scale(1,1) skewX(-2deg)}to{transform:scale(.92,1.08) skewX(3deg)}}
@keyframes glow{from{opacity:.25}to{opacity:.45}}
.smoke{fill:#b9b2a8;transform-box:fill-box;transform-origin:center;animation:smoke 1.6s ease-out forwards}
@keyframes smoke{from{opacity:.7;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-46px) scale(1.8)}}

/* drive scene */
#driveScene{padding:0;justify-content:flex-start}
#world{position:absolute;inset:0;width:100%;height:100%}
#skyNight,#stars,#tint,#moon{transition:opacity 7s ease;opacity:0}
.night #skyNight,.night #stars,.night #moon{opacity:1}
.night #tint{opacity:.45}
.dance{transform-box:fill-box;transform-origin:50% 100%;animation:dance .5s ease-in-out infinite alternate}
.dance.d2{animation-delay:-.25s}
@keyframes dance{from{transform:translateY(0) rotate(-12deg)}to{transform:translateY(-16px) rotate(12deg)}}
.sun{transition:opacity 7s ease}
.night .sun{opacity:0}
#tint{transition:opacity 7s ease}
.star{animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
#note{max-height:82vh;overflow-y:auto;position:relative;z-index:2;margin-top:max(6vh,24px);width:min(520px,88vw);text-align:center;background:rgba(251,248,242,.72);border-radius:18px;padding:24px 26px 18px;box-shadow:0 20px 60px rgba(0,0,0,.25);opacity:0;transform:translateY(12px);transition:opacity 1.2s ease,transform 1.2s ease;pointer-events:none}
#note.show{opacity:1;transform:none;pointer-events:auto}
#note p{white-space:pre-line;font-family:"Dancing Script",cursive;font-size:clamp(15px,3.2vw,18px);line-height:1.35;text-align:left}

#musicBtn{position:fixed;right:16px;bottom:16px;z-index:20;width:44px;height:44px;border-radius:50%;border:1px solid rgba(45,42,38,.25);background:rgba(251,248,242,.85);font-size:18px}
#musicBtn.on{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(244,167,195,.35)}}
#yt{position:fixed;left:0;bottom:0;width:200px;height:200px;opacity:.01;pointer-events:none;overflow:hidden;transform:translate(-190px,190px)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:15}
#prank{position:fixed;top:9vh;left:50%;transform:translate(-50%,-10px);z-index:25;font-size:15px;color:var(--muted);text-align:center;white-space:nowrap;opacity:0;transition:opacity .4s ease,transform .4s ease;pointer-events:none}
#prank.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<script>
const SONG = 'VPRjCeoBqrI';   // A Sky Full of Stars (YouTube video id)
const CANDLES = 5;            // number of candles (1-9)

const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const el = (t, a = {}, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const rand = (a, b) => a + Math.random() * (b - a);

function showScene(id) {
  ['#start', '#wishScene', '#cakeScene', '#driveScene'].forEach(s => $(s).classList.toggle('hidden', s !== id));
}

/* cake decorations */
function drips(g, cx, cy, rx, ry, x0, x1, step, lens) {
  let i = 0;
  for (let x = x0; x <= x1; x += step, i++) {
    const edge = cy + ry * Math.sqrt(Math.max(0, 1 - ((x - cx) / rx) ** 2));
    el('line', { x1: x, y1: edge - 6, x2: x, y2: edge + lens[i % lens.length] }, g);
  }
  el('path', { d: `M${cx - rx} ${cy} Q${cx - rx} ${cy + ry * 1.2} ${cx} ${cy + ry * 1.2} Q${cx + rx} ${cy + ry * 1.2} ${cx + rx} ${cy}` }, g);
}
drips($('#drips1'), 200, 222, 138, 22, 70, 330, 20, [8, 18, 11, 24, 9, 15]);
drips($('#drips2'), 200, 150, 78, 14, 128, 272, 16, [7, 14, 9, 18, 6]);
const sprinkleCols = ['#fff', '#7fb3d5', '#f2c14e', '#9cc5a1', '#ee5f90'];
function sprinkles(g, x0, x1, y0, y1, n) {
  for (let i = 0; i < n; i++) {
    const x = rand(x0, x1), y = rand(y0, y1);
    el('rect', { x, y, width: 7, height: 2.4, rx: 1.2, fill: sprinkleCols[i % 5], transform: `rotate(${rand(0, 180).toFixed(0)} ${x} ${y})` }, g);
  }
}
sprinkles($('#sprinkles1'), 75, 325, 262, 305, 34);
sprinkles($('#sprinkles2'), 132, 268, 178, 210, 16);

/* candles */
const candleCols = ['#7fb3d5', '#f2c14e', '#9cc5a1', '#ee5f90', '#b9a3e3'];
/* prank: the first two taps make the candle dodge */
let pranks = 0, prankTimer = null;
function prankSay(text) {
  const p = $('#prank');
  p.textContent = text; p.classList.add('show');
  clearTimeout(prankTimer);
  prankTimer = setTimeout(() => p.classList.remove('show'), 3000);
}
function dodge(c) {
  const bx = +c.dataset.x, by = +c.dataset.y;
  // pick a free spot on the cake (never on top of another candle), away from where it was
  const others = [...document.querySelectorAll('.candle')].filter(o => o !== c)
    .map(o => ({ x: +o.dataset.x, y: +o.dataset.y }));
  const cands = [];
  for (let x = 96; x <= 304; x += 4) for (const dy of [-14, 0, 14]) {
    const cx = x, cy = by + dy;
    if (Math.abs(cx - bx) < 30) continue;
    if (others.every(o => Math.hypot(o.x - cx, o.y - cy) >= 34)) cands.push([cx, cy]);
  }
  let tx, ty;
  if (cands.length) [tx, ty] = cands[Math.floor(Math.random() * cands.length)];
  else { tx = bx; ty = by - 46; }   // no room sideways: hop up instead so it still moves
  const t0 = performance.now(), dur = 380;
  (function f(t) {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    c.setAttribute('transform', `translate(${(bx + (tx - bx) * e).toFixed(1)},${(by + (ty - by) * e).toFixed(1)})`);
    if (p < 1) requestAnimationFrame(f);
  })(t0);
  c.dataset.x = tx.toFixed(1); c.dataset.y = ty.toFixed(1);
}
function buildCandles() {
  const g = $('#candles'); g.innerHTML = '';
  const n = Math.max(1, Math.min(9, CANDLES)), spots = [];
  for (let i = 0; i < n; i++) {
    const a = Math.PI + (i + .5) / n * Math.PI;
    spots.push({ x: n === 1 ? 200 : 200 + Math.cos(a) * 58, y: 150 + Math.sin(a) * 6 + (i % 2 ? 5 : 0) });
  }
  spots.sort((a, b) => a.y - b.y).forEach((p, i) => {
    const c = el('g', { class: 'candle', transform: `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})` }, g);
    el('circle', { class: 'glow', cy: -58, r: 20, fill: 'url(#glowG)' }, c);
    el('rect', { x: -5, y: -44, width: 10, height: 44, rx: 3, fill: candleCols[i % 5] }, c);
    el('path', { d: 'M-5 -34 L5 -40 M-5 -22 L5 -28 M-5 -10 L5 -16', stroke: '#fff', 'stroke-width': 2, opacity: .7 }, c);
    el('line', { x1: 0, y1: -44, x2: 0, y2: -50, stroke: '#3a2a22', 'stroke-width': 1.6 }, c);
    el('path', { class: 'flame', d: 'M0 -48 C-7 -55 -6 -66 0 -77 C6 -66 7 -55 0 -48Z', fill: 'url(#flameG)' }, c);
    c.dataset.x = p.x.toFixed(1); c.dataset.y = p.y.toFixed(1);
    c.addEventListener('click', () => {
      if (c.classList.contains('out')) return;
      if (pranks < 2) { pranks++; dodge(c); prankSay(pranks === 1 ? ':D' : 'ok fine i\u2019ll stop'); return; }
      blow(c);
    });
  });
}
const lit = () => [...document.querySelectorAll('.candle:not(.out)')];
function blow(c) {
  if (!c || c.classList.contains('out')) return;
  c.classList.add('out');
  for (let k = 0; k < 3; k++) {
    const s = el('circle', { class: 'smoke', cx: rand(-3, 3), cy: -52, r: 4 }, c);
    s.style.animationDelay = k * .18 + 's'; setTimeout(() => s.remove(), 2200);
  }
  if (!lit().length) allOut();
}
const blowRandom = () => { const l = lit(); if (l.length) blow(l[Math.floor(Math.random() * l.length)]); };

/* mic */
let mic = null;
async function startMic() {
  try {
    mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const ac = new (window.AudioContext || window.webkitAudioContext)(), an = ac.createAnalyser(); an.fftSize = 1024;
    ac.createMediaStreamSource(mic).connect(an);
    const buf = new Uint8Array(an.frequencyBinCount); let base = 0, frames = 0, hot = 0;
    $('#hint').textContent = 'listening… make a wish and blow';
    (function loop() {
      if (!lit().length) return stopMic();
      an.getByteFrequencyData(buf);
      let s = 0; for (let i = 1; i < 40; i++) s += buf[i]; const lvl = s / 39;
      if (frames < 30) { base = Math.max(base, lvl); frames++; }
      else if (lvl > Math.max(base + 45, 120)) { if (++hot > 3) { blowRandom(); if (lvl > 185) blowRandom(); hot = 0; } }
      else hot = Math.max(0, hot - 1);
      requestAnimationFrame(loop);
    })();
  } catch (e) { $('#hint').textContent = 'tap the candles to blow them out'; }
}
function stopMic() { if (mic) mic.getTracks().forEach(t => t.stop()); mic = null; }

function allOut() {
  stopMic();
  $('#hint').textContent = 'wish granted ✦';
  confetti();
  setTimeout(startDrive, 2600);
}
function lightUp() {
  driveRun++; busy = false; pranks = 0;
  showScene('#cakeScene');
  buildCandles();
  $('#hint').textContent = 'tap the candles to blow them out';
}

/* confetti */
function confetti() {
  const c = $('#confetti'), x = c.getContext('2d'), d = devicePixelRatio || 1;
  c.width = innerWidth * d; c.height = innerHeight * d; x.setTransform(d, 0, 0, d, 0, 0);
  const cols = ['#f4a7c3', '#f2c14e', '#7fb3d5', '#9cc5a1', '#ee5f90'];
  const P = Array.from({ length: 170 }, () => ({ x: innerWidth / 2, y: innerHeight * .45, vx: rand(-9, 9), vy: rand(-15, -4), r: rand(4, 8), a: rand(0, 6), va: rand(-.2, .2), c: cols[Math.floor(rand(0, 5))] }));
  const t0 = performance.now();
  (function f(t) {
    x.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); });
    if (t - t0 < 4000) requestAnimationFrame(f); else x.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

/* beach drive (after candles) */

/* story: one paragraph per "next"; the jeep drives to a new spot each time */
const STORY = ["Dear my lovely Bung!", "Happy 24th birthday!!! We’re officially the same age now! These past two years with you have been an absolute blast, and it honestly feels like our love just keeps on growing. I love you so so much, Jay, and I’m so proud of everything you’ve accomplished this year and the person you continue to become.", "You put so much heart and dedication into everything you do, and it shows in every part of your life. I love your passion for music, and your dedication to running (a 5k and then a half marathon wowsies!!) how much you care about your work (although sometimes I wish you’d take it a little easier so you don’t overwork yourself ). I love how you go after anything you set your mind to. I hope you know that you honestly inspire me every day Bung.", "I love how goofy we can be around each other, and I love your calmness and patience just as much. Thank you for always letting me be myself and for being your lovely, silly self with me too. I love our loveeeee, woopie!!!\nI cannot wait to travel more with you and make so many more memories together. From our big adventures to the little everyday moments, I’m just so happy I get to share them with you. Here’s to another year of you, and another year of us", "I love you so so much ♡\n\nYour Bing"];
const STOPS = [150, 370, 590, 810, 1020];   // where the jeep parks for each paragraph
const EXIT_X = 1350;                       // drives off screen after the last paragraph
let driveRun = 0, jeepX = -420, wheelRot = 0, step = -1, busy = false;

function drawJeep(x, ts, moving) {
  const world = $('#world');
  $('#jeep').setAttribute('transform', `translate(${x.toFixed(1)},470)`);
  wheelRot += (x - jeepX) / 30 * 180 / Math.PI; jeepX = x;
  world.querySelectorAll('.wheel').forEach(w => w.setAttribute('transform', `rotate(${wheelRot.toFixed(1)})`));
  const bob = moving ? Math.sin(ts / 85) * 1.8 : Math.sin(ts / 160) * .5;
  $('#jeepBody').setAttribute('transform', `translate(0,${bob.toFixed(2)})`);
}
function moveJeep(toX, done) {
  const run = ++driveRun, from = jeepX, dist = toX - from, dur = Math.max(1500, Math.abs(dist) * 9);
  busy = true; let t0 = null;
  (function f(ts) {
    if (run !== driveRun) return;
    if (t0 === null) t0 = ts;
    const p = Math.min(1, (ts - t0) / dur), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    drawJeep(from + dist * e, ts, p < 1);
    if (p < 1) requestAnimationFrame(f);
    else { busy = false; done && done(); }
  })(performance.now());
}
function showStep(i) {
  $('#para').textContent = STORY[i];
  $('#nextBtn').textContent = i === STORY.length - 1 ? 'drive off ›' : 'next ›';
  $('#nextBtn').style.display = '';
  $('#note').classList.add('show');
  busy = false;
}
/* dance-party beat (synthesized, no internet needed) */
let beat = null;
function startBeat() {
  if (beat) return;
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const master = ac.createGain(); master.gain.value = .32; master.connect(ac.destination);
  const eighth = 60 / 118 / 2;
  const nb = ac.createBuffer(1, ac.sampleRate * .3, ac.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const bass = [131, 131, 196, 220, 174, 196, 131, 147], lead = [523, 659, 784, 659, 698, 784, 880, 784];
  const kick = t => { const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + .15);
    g.gain.setValueAtTime(.9, t); g.gain.exponentialRampToValueAtTime(.001, t + .25);
    o.connect(g).connect(master); o.start(t); o.stop(t + .3); };
  const hat = t => { const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = nb; f.type = 'highpass'; f.frequency.value = 7000;
    g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t + .06);
    src.connect(f).connect(g).connect(master); src.start(t); src.stop(t + .08); };
  const tone = (t, hz, type, dur, vol) => { const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = hz;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + .02); };
  let nextT = ac.currentTime + .1, n = 0;
  const timer = setInterval(() => {
    while (nextT < ac.currentTime + .2) {
      const step = n % 8, t = nextT;
      if (n % 2 === 0) kick(t); else hat(t);
      tone(t, lead[step], 'square', eighth * .9, .05);
      if (step % 2 === 0) tone(t, bass[step], 'sawtooth', eighth * .9, .07);
      nextT += eighth; n++;
    }
  }, 50);
  beat = { ac, timer };
}
function stopBeat() { if (!beat) return; clearInterval(beat.timer); beat.ac.close(); beat = null; }
function showFinale() {
  Music.pause(); startBeat();
  $('#jeep').style.display = 'none';
  $('#finale').style.opacity = '1';
  $('#nextBtn').style.display = 'none';
  $('#note').classList.remove('show');
}
function startDrive() {
  driveRun++; step = -1; stopBeat();
  $('#jeep').style.display = ''; $('#finale').style.opacity = '0';
  jeepX = -420; wheelRot = 0; drawJeep(jeepX, 0, false);
  $('#note').classList.remove('show');
  showScene('#driveScene');
  setTimeout(() => moveJeep(STOPS[0], () => { step = 0; showStep(0); }), 1200);
}
$('#nextBtn').onclick = () => {
  if (busy) return;
  $('#note').classList.remove('show');
  step++;
  if (step < STORY.length) moveJeep(STOPS[step], () => showStep(step));
  else moveJeep(EXIT_X, showFinale);
};

/* music (YouTube) */
const Music = { yt: null, ready: false, on: false, failed: false,
  play() { this.on = true; if (this.ready) { this.yt.unMute(); this.yt.setVolume(75); this.yt.playVideo(); } ui(); },
  pause() { this.on = false; if (this.ready) this.yt.pauseVideo(); ui(); } };
window.onYouTubeIframeAPIReady = () => {
  Music.yt = new YT.Player('ytPlayer', { width: 200, height: 200, videoId: SONG,
    playerVars: { playsinline: 1, controls: 0, loop: 1, playlist: SONG },
    events: { onReady: () => { Music.ready = true; if (Music.on) Music.play(); }, onError: () => { Music.failed = true; } } });
};
(() => { const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = () => Music.failed = true; document.head.appendChild(s); })();
function ui() { $('#musicBtn').classList.toggle('on', Music.on); $('#musicBtn').textContent = Music.on ? '♪' : '♩'; }
$('#musicBtn').onclick = () => {
  if (beat) return stopBeat();
  if (Music.failed) return window.open('https://www.youtube.com/watch?v=' + SONG, '_blank');
  Music.on ? Music.pause() : Music.play();
};

$('#openBtn').onclick = () => { Music.play(); showScene('#wishScene'); };
$('#wishBtn').onclick = lightUp;
ui();
</script>
